<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2b3442">
  <link rel="manifest" href="/manifest.json">
  <title>Euclid - Bug Tracker</title>
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/kanban.css">
</head>
<body>
  <div class="offline-banner">Offline - changes will sync when you reconnect</div>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">EUCLID</div>
      <div class="brand-sub">Project Management Tool</div>
      <div class="nav-label">NAVIGATION</div>
      <nav class="nav">
        <a href="/dashboard">Dashboard</a>
        <a href="/journal">Developer Journal</a>
        <a href="/kanban">Bug Tracker</a>
        <a href="/requirements">Requirements</a>
        <a href="/references">References</a>
      </nav>
      <div class="spacer"></div>
      <div class="user-box">
        <div class="nav-label">USER PROFILE</div>
        <div class="uname" id="nav-username">...</div>
        <a href="/logout" class="btn btn-sm">Logout</a>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <span class="bracket">BUG TRACKER - KANBAN VIEW</span>
        <button class="btn btn-primary btn-sm" id="add-btn">+ Add Bug</button>
      </div>
      <div class="content">
        <p class="note">Drag a card between columns to change its status</p>
        <div class="board">
          <div class="column" data-status="Urgent">
            <div class="col-head urgent">URGENT</div>
            <div class="col-body" id="col-urgent"></div>
          </div>
          <div class="column" data-status="To-Do">
            <div class="col-head">TO DO</div>
            <div class="col-body" id="col-todo"></div>
          </div>
          <div class="column" data-status="Completed">
            <div class="col-head done">COMPLETED</div>
            <div class="col-body" id="col-completed"></div>
          </div>
        </div>

        <div class="panel" id="bug-form-panel" hidden>
          <div class="panel-head">
            <span class="bracket" id="bug-form-title">ADD BUG</span>
            <button class="btn btn-sm" id="close-form">Close</button>
          </div>
          <div class="panel-body">
            <form id="bug-form" novalidate>
              <input type="hidden" id="bug-id">
              <div class="field">
                <label for="title">Bug Title / Summary *</label>
                <input type="text" id="title">
                <div class="field-error" id="err-title"></div>
              </div>
              <div class="field">
                <label for="description">Steps to Reproduce / Full Description</label>
                <textarea id="description" rows="5"></textarea>
              </div>
              <div class="row">
                <div class="field">
                  <label for="status">Status *</label>
                  <select id="status">
                    <option value="">Select Status</option>
                    <option>Urgent</option>
                    <option>To-Do</option>
                    <option>Completed</option>
                  </select>
                  <div class="field-error" id="err-status"></div>
                </div>
                <div class="field">
                  <label for="priority">Priority</label>
                  <select id="priority">
                    <option value="">Select Priority</option>
                    <option>Critical</option>
                    <option>High</option>
                    <option>Medium</option>
                    <option>Low</option>
                  </select>
                </div>
                <div class="field">
                  <label for="reported_date">Date Reported *</label>
                  <input type="date" id="reported_date">
                </div>
              </div>
              <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Bug</button>
                <button type="button" class="btn" id="cancel-btn">Cancel</button>
                <button type="button" class="btn btn-danger" id="delete-btn" hidden>Delete Bug</button>
              </div>
            </form>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="/static/js/offline.js"></script>
  <script src="/static/js/utils.js"></script>
  <script src="/static/js/kanban.js"></script>
</body>
</html>
