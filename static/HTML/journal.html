<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2b3442">
  <link rel="manifest" href="/manifest.json">
  <title>Euclid - Developer Journal</title>
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/journal.css">
</head>
<body>
  <div class="offline-banner">Offline - changes will sync when you reconnect</div>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">EUCLID</div>
      <div class="brand-sub">Project Management Tool</div>
      <div class="nav-label">NAVIGATION</div>
      <nav class="nav">
        <a href="/dashboard">Dashboard</a>
        <a href="/journal">Developer Journal</a>
        <a href="/kanban">Bug Tracker</a>
        <a href="/requirements">Requirements</a>
        <a href="/references">References</a>
      </nav>
      <div class="spacer"></div>
      <div class="user-box">
        <div class="nav-label">USER PROFILE</div>
        <div class="uname" id="nav-username">...</div>
        <a href="/logout" class="btn btn-sm">Logout</a>
      </div>
    </aside>
    
       <main class="main">
      <div class="topbar"><span class="bracket">DEVELOPER JOURNAL</span></div>
      <div class="content split">

        <div class="panel list-panel">
          <div class="panel-head">
            <span class="bracket">ENTRY LIST</span>
            <button class="btn btn-sm" id="new-btn">+ New</button>
          </div>
          <div class="panel-body">
            <input type="search" id="search" placeholder="Search entries...">
            <ul class="entry-list" id="entry-list"></ul>
          </div>
        </div>

        <div class="panel form-panel">
          <div class="panel-head"><span class="bracket" id="form-title">NEW JOURNAL ENTRY</span></div>
          <div class="panel-body">
            <form id="journal-form" novalidate>
              <input type="hidden" id="entry-id">
              <div class="field">
                <label for="title">Entry Title *</label>
                <input type="text" id="title">
                <div class="field-error" id="err-title"></div>
              </div>
              <div class="row">
                <div class="field">
                  <label for="date">Date *</label>
                  <input type="date" id="date">
                  <div class="field-error" id="err-date"></div>
                </div>
                <div class="field">
                  <label for="project_tag">Project / Context Tag</label>
                  <input type="text" id="project_tag" placeholder="e.g. sprint-3, backend">
                </div>
              </div>
              <div class="row">
                <div class="field">
                  <label for="entry_type">Entry Type</label>
                  <select id="entry_type">
                    <option value="">Select Entry Type</option>
                    <option>Daily Log</option>
                    <option>Decision Record</option>
                    <option>Retrospective</option>
                    <option>Problem Note</option>
                    <option>Research Note</option>
                  </select>
                </div>
                <div class="field">
                  <label for="related_module">Related Module</label>
                  <select id="related_module">
                    <option value="">Select Related Module</option>
                    <option>General</option>
                    <option>Bug Tracker</option>
                    <option>Requirements</option>
                    <option>References</option>
                    <option>Authentication</option>
                  </select>
                </div>
              </div>
              <div class="field">
                <label for="content">Journal Content *</label>
                <textarea id="content" rows="10" placeholder="Write your journal entry here..."></textarea>
                <div class="field-error" id="err-content"></div>
              </div>
              <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Entry</button>
                <button type="button" class="btn" id="cancel-btn">Cancel</button>
                <button type="button" class="btn btn-danger" id="delete-btn" hidden>Delete Entry</button>
              </div>
            </form>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="/static/js/offline.js"></script>
  <script src="/static/js/utils.js"></script>
  <script src="/static/js/journal.js"></script>
</body>
</html>
